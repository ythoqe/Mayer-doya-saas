    <script>
      (function() {
        // Fix for "Cannot set property fetch of #<Window> which has only a getter"
        try {
          var realFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var customFetch = realFetch;
          
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // If property cannot be redefined in sandbox, fail silently
        }

        // Global handler to suppress unhandled abort errors & fetch getter collisions
        window.addEventListener('error', function(event) {
          if (event && event.message) {
            var msg = String(event.message);
            if (
              msg.indexOf('Cannot set property fetch') !== -1 ||
              msg.indexOf('The user aborted a request') !== -1
            ) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            var reasonMsg = event.reason.message || String(event.reason);
            var isAbort = reasonMsg.indexOf('The user aborted a request') !== -1 ||
                          reasonMsg.indexOf('aborted') !== -1 ||
                          event.reason.name === 'AbortError';
            var isFetchGetter = reasonMsg.indexOf('Cannot set property fetch') !== -1;
            
            if (isAbort || isFetchGetter) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          }
        }, true);
      })();
    </script>
